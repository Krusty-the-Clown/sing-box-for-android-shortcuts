name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve latest beta core tag (by beta.N number)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Ищем тег с максимальным номером beta.N..."
          MATCH=$(gh api repos/SagerNet/sing-box/tags --paginate \
            -q '[.[] | select(.name | test("^v1\\.14\\.0-beta\\.[0-9]+$"))]' \
            | jq -r 'max_by(.name | capture("beta\\.(?<n>[0-9]+)$").n | tonumber)')

          if [ -z "$MATCH" ] || [ "$MATCH" == "null" ]; then
            echo "❌ Подходящий тег не найден"
            exit 1
          fi

          TARGET_TAG=$(echo "$MATCH" | jq -r '.name')
          CORE_SHA=$(echo "$MATCH" | jq -r '.commit.sha')
          echo "Тег ядра: $TARGET_TAG ($CORE_SHA)"

          CORE_DATE=$(gh api repos/SagerNet/sing-box/commits/$CORE_SHA -q '.commit.committer.date')
          echo "Дата коммита ядра: $CORE_DATE"

          echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
          echo "CORE_SHA=$CORE_SHA" >> $GITHUB_ENV
          echo "CORE_DATE=$CORE_DATE" >> $GITHUB_ENV

      - name: Pin app checkout to the same date as core beta tag
        run: |
          echo "Дата релиза ядра $TARGET_TAG: $CORE_DATE"
          git fetch origin dev
          APP_COMMIT=$(git log origin/dev -1 --before="$CORE_DATE" --format=%H)

          if [ -z "$APP_COMMIT" ]; then
            echo "❌ Не найден коммит приложения на эту дату"
            exit 1
          fi
          echo "Коммит приложения на эту дату: $APP_COMMIT"
          git checkout "$APP_COMMIT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download official libbox.aar (matching beta tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          echo "Ищем CI-сборку для тега $TARGET_TAG..."
          RUN_ID=$(gh run list -R SagerNet/sing-box -b "$TARGET_TAG" -s success -L 1 --json databaseId -q '.[0].databaseId')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" == "null" ]; then
            echo "❌ Готовой CI-сборки под тег $TARGET_TAG не нашлось"
            exit 1
          fi
          echo "ID сборки: $RUN_ID"
          gh run download $RUN_ID -R SagerNet/sing-box -D /tmp/artifacts || true

          FOUND=0
          for aar_file in $(find /tmp/artifacts -type f -name "*.aar"); do
            if unzip -l "$aar_file" | grep -q "arm64-v8a/libbox.so"; then
              echo "✅ Найдено ядро $TARGET_TAG в: $aar_file"
              cp "$aar_file" app/libs/libbox.aar
              FOUND=1
              break
            fi
          done

          if [ $FOUND -eq 0 ]; then
            echo "❌ Ошибка: подходящий файл ядра не найден"
            exit 1
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleOtherDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-debug
          path: app/build/outputs/apk/**/*.apk
