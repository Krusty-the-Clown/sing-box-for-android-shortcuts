name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: 'Коммит/ветка приложения (пусто = dev HEAD). Укажите SHA, если dev временно не собирается.'
        required: false
        default: ''
      core_tag:
        description: 'Тег ИЛИ commit SHA ядра sing-box (пусто = автопоиск самой свежей версии с готовым .aar). Например: v1.14.0-rc.5'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive
          fetch-depth: 0

      - name: Checkout requested app ref (if specified)
        if: ${{ github.event.inputs.app_ref != '' }}
        run: |
          echo "Переключаюсь на явно указанный ref: ${{ github.event.inputs.app_ref }}"
          git fetch origin "${{ github.event.inputs.app_ref }}" || true
          git checkout "${{ github.event.inputs.app_ref }}"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Resolve core tag (manual override or auto newest-with-aar search)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MANUAL_TAG="${{ github.event.inputs.core_tag }}"

          if [ -n "$MANUAL_TAG" ]; then
            echo "Указан тег вручную: $MANUAL_TAG"
            CORE_SHA=$(gh api "repos/SagerNet/sing-box/git/ref/tags/$MANUAL_TAG" -q '.object.sha')
            if [ -z "$CORE_SHA" ] || [ "$CORE_SHA" == "null" ]; then
              echo "❌ Тег $MANUAL_TAG не найден в репозитории SagerNet/sing-box"
              exit 1
            fi
            TARGET_TAG="$MANUAL_TAG"
          else
            echo "Ищем самую свежую версию с готовым .aar-артефактом (релиз > rc > beta при равном номере)..."
            ALL_TAGS=$(gh api repos/SagerNet/sing-box/tags --paginate)
            CANDIDATES=$(echo "$ALL_TAGS" | jq -r '
              [.[] | select(.name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-(beta|rc)\\.[0-9]+)?$"))
               | . + {parsed: (.name | capture("^v(?<maj>[0-9]+)\\.(?<min>[0-9]+)\\.(?<pat>[0-9]+)(-(?<stage>beta|rc)\\.(?<num>[0-9]+))?$"))}
               | . + {score: (
                   (.parsed.maj | tonumber) * 1000000000
                   + (.parsed.min | tonumber) * 1000000
                   + (.parsed.pat | tonumber) * 1000
                   + (if .parsed.stage == null then 900
                      elif .parsed.stage == "rc" then 500 + (.parsed.num | tonumber)
                      else (.parsed.num | tonumber) end)
                 )}
              ]
              | sort_by(-.score)
              | .[] | "\(.name) \(.commit.sha)"')

            if [ -z "$CANDIDATES" ]; then
              echo "❌ Подходящий тег не найден"
              exit 1
            fi

            TARGET_TAG=""
            while IFS= read -r line; do
              CAND_TAG=$(echo "$line" | awk '{print $1}')
              CAND_SHA=$(echo "$line" | awk '{print $2}')
              RUN_CHECK=$(gh api "repos/SagerNet/sing-box/actions/runs?head_sha=${CAND_SHA}&status=success" \
                -q '.workflow_runs[] | select(.name=="Build") | .id' | head -n1)

              if [ -z "$RUN_CHECK" ]; then
                echo "⏭️  У тега $CAND_TAG нет готовой CI-сборки Build, пробуем следующий по свежести"
                continue
              fi

              AAR_ARTIFACT=$(gh api repos/SagerNet/sing-box/actions/runs/$RUN_CHECK/artifacts \
                -q '.artifacts[] | select(.name | test("^libbox-android-"; "i")) | .name' | head -n1)

              if [ -n "$AAR_ARTIFACT" ]; then
                echo "✅ У тега $CAND_TAG есть готовый .aar-артефакт ($AAR_ARTIFACT в сборке $RUN_CHECK) — используем его"
                TARGET_TAG="$CAND_TAG"
                CORE_SHA="$CAND_SHA"
                break
              else
                echo "⏭️  У тега $CAND_TAG сборка Build есть, но .aar-артефакта среди файлов нет (только бинарники/APK), пробуем следующий"
              fi
            done <<< "$CANDIDATES"

            if [ -z "$TARGET_TAG" ]; then
              echo "❌ Ни у одного тега не нашлось готовой CI-сборки Build с .aar"
              exit 1
            fi
          fi

          echo "Тег ядра: $TARGET_TAG ($CORE_SHA)"

          CORE_DATE=$(gh api repos/SagerNet/sing-box/commits/$CORE_SHA -q '.commit.committer.date')
          echo "Дата коммита ядра: $CORE_DATE"

          echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
          echo "CORE_SHA=$CORE_SHA" >> $GITHUB_ENV
          echo "CORE_DATE=$CORE_DATE" >> $GITHUB_ENV

      - name: Verify custom shortcut code is present
        run: |
          MISSING=0

          if ! grep -q "ACTION_START" app/src/main/res/xml/shortcuts.xml 2>/dev/null; then
            echo "⚠️ shortcuts.xml не содержит наших правок"
            MISSING=1
          fi

          if ! grep -q "handleShortcut" app/src/main/java/io/nekohasekai/sfa/compose/MainActivity.kt 2>/dev/null; then
            echo "⚠️ MainActivity.kt не содержит handleShortcut"
            MISSING=1
          fi

          if [ "$MISSING" -eq 1 ]; then
            echo "❌ Кастомный код ярлыков не найден в текущем чекауте — проверьте, закоммичены ли правки"
            exit 1
          else
            echo "✅ Правки на месте"
          fi

      - name: Download official libbox.aar (matching resolved tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          echo "Ищем прогон workflow Build по SHA коммита ядра: $CORE_SHA"
          RUN_ID=$(gh api "repos/SagerNet/sing-box/actions/runs?head_sha=${CORE_SHA}&status=success" \
            -q '.workflow_runs[] | select(.name=="Build") | .id' | head -n1)

          if [ -z "$RUN_ID" ]; then
            echo "❌ Успешного прогона workflow Build для коммита $CORE_SHA не нашлось"
            echo "Все прогоны для этого коммита (для диагностики):"
            gh api "repos/SagerNet/sing-box/actions/runs?head_sha=${CORE_SHA}" \
              -q '.workflow_runs[] | "\(.name) — \(.conclusion) — \(.html_url)"'
            exit 1
          fi
          echo "ID сборки: $RUN_ID"

          echo "Артефакты этого запуска:"
          gh api repos/SagerNet/sing-box/actions/runs/$RUN_ID/artifacts -q '.artifacts[].name'

          ARTIFACT_NAMES=$(gh api repos/SagerNet/sing-box/actions/runs/$RUN_ID/artifacts \
            -q '.artifacts[] | select(.name | test("android|aar|libbox"; "i")) | .name')

          if [ -z "$ARTIFACT_NAMES" ]; then
            echo "❌ Среди артефактов сборки $RUN_ID нет ничего похожего на android/aar/libbox"
            exit 1
          fi

          while IFS= read -r NAME; do
            echo "Скачиваю артефакт: $NAME"
            gh run download $RUN_ID -R SagerNet/sing-box -n "$NAME" -D "/tmp/artifacts/$NAME"
          done <<< "$ARTIFACT_NAMES"

          FOUND=0
          for aar_file in $(find /tmp/artifacts -type f -name "*.aar"); do
            if unzip -l "$aar_file" | grep -q "arm64-v8a/libbox.so"; then
              echo "✅ Найдено ядро $TARGET_TAG в: $aar_file"
              cp "$aar_file" app/libs/libbox.aar
              FOUND=1
              break
            fi
          done

          if [ $FOUND -eq 0 ]; then
            echo "❌ Ошибка: подходящий файл ядра не найден"
            exit 1
          fi

      - name: Print embedded core version from libbox.aar (ground truth)
        run: |
          mkdir -p /tmp/aar_inspect
          unzip -o app/libs/libbox.aar -d /tmp/aar_inspect > /dev/null
          SO_FILE=$(find /tmp/aar_inspect -name "libbox.so" -path "*arm64-v8a*" | head -n1)
          if [ -z "$SO_FILE" ]; then
            echo "⚠️ Не удалось найти libbox.so внутри aar для проверки"
          else
            echo "Версия, реально зашитая в $SO_FILE:"
            strings "$SO_FILE" | grep -E "^v?1\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$" | sort -u | head -20
          fi
          echo "(Для сравнения: целевой тег из шага резолва — $TARGET_TAG)"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Auto-find newest commit that actually compiles
        if: ${{ github.event.inputs.app_ref == '' }}
        run: |
          MAX_ATTEMPTS=30
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            CURRENT=$(git rev-parse HEAD)
            echo "Попытка $((ATTEMPT+1))/$MAX_ATTEMPTS: пробую скомпилировать коммит $CURRENT"
            if ./gradlew :app:compileOtherDebugKotlin --no-daemon; then
              echo "✅ Коммит $CURRENT компилируется, используем его"
              break
            fi
            echo "❌ Коммит $CURRENT не компилируется, откатываюсь на предыдущий"
            git reset --hard HEAD~1
            ATTEMPT=$((ATTEMPT+1))
          done
          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "❌ За $MAX_ATTEMPTS попыток не нашли компилируемый коммит"
            exit 1
          fi

          if ! grep -q "handleShortcut" app/src/main/java/io/nekohasekai/sfa/compose/MainActivity.kt 2>/dev/null; then
            echo "❌ Откатились дальше, чем наш коммит с правками — handleShortcut больше не найден"
            exit 1
          fi

      - name: Build APK
        run: ./gradlew assembleOtherDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-debug
          path: app/build/outputs/apk/**/*.apk
