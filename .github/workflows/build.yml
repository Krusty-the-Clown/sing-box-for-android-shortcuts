name: Build APK (dev, source-matched core)

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: 'Коммит/ветка приложения (пусто = dev HEAD). Укажите SHA, если dev временно не собирается.'
        required: false
        default: ''
      core_branch:
        description: 'Ветка ядра sing-box для сборки из исходников (пусто = автовыбор unstable/testing)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive
          fetch-depth: 0

      - name: Checkout requested app ref (if specified)
        if: ${{ github.event.inputs.app_ref != '' }}
        run: |
          echo "Переключаюсь на явно указанный ref: ${{ github.event.inputs.app_ref }}"
          git fetch origin "${{ github.event.inputs.app_ref }}" || true
          git checkout "${{ github.event.inputs.app_ref }}"

      - name: Verify custom shortcut code is present
        run: |
          MISSING=0
          if ! grep -q "ACTION_START" app/src/main/res/xml/shortcuts.xml 2>/dev/null; then
            echo "⚠️ shortcuts.xml не содержит наших правок"
            MISSING=1
          fi
          if ! grep -q "handleShortcut" app/src/main/java/io/nekohasekai/sfa/compose/MainActivity.kt 2>/dev/null; then
            echo "⚠️ MainActivity.kt не содержит handleShortcut"
            MISSING=1
          fi
          if [ "$MISSING" -eq 1 ]; then
            echo "❌ Кастомный код ярлыков не найден в текущем чекауте — проверьте, закоммичены ли правки"
            exit 1
          else
            echo "✅ Правки на месте"
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: List available sing-box branches (diagnostic)
        run: |
          echo "Реальные ветки репозитория SagerNet/sing-box:"
          git ls-remote --heads https://github.com/SagerNet/sing-box.git | awk -F'refs/heads/' '{print $2}'

      - name: Clone sing-box core (matching branch) and read required Go version
        run: |
          CORE_BRANCH="${{ github.event.inputs.core_branch }}"
          if [ -z "$CORE_BRANCH" ]; then
            CORE_BRANCH="unstable"
          fi
          echo "Проверяю, существует ли ветка $CORE_BRANCH..."
          if ! git ls-remote --exit-code --heads https://github.com/SagerNet/sing-box.git "$CORE_BRANCH" > /dev/null; then
            echo "⚠️ Ветка $CORE_BRANCH не найдена, пробую 'testing' как запасной вариант..."
            CORE_BRANCH="testing"
            if ! git ls-remote --exit-code --heads https://github.com/SagerNet/sing-box.git "$CORE_BRANCH" > /dev/null; then
              echo "❌ Ни unstable, ни testing не найдены — смотрите список веток в предыдущем шаге и укажите нужную вручную через поле core_branch"
              exit 1
            fi
          fi
          echo "Клонирую sing-box@$CORE_BRANCH..."
          git clone --depth 1 --branch "$CORE_BRANCH" https://github.com/SagerNet/sing-box.git /tmp/sing-box-src
          CORE_SHA=$(git -C /tmp/sing-box-src rev-parse HEAD)
          CORE_DATE=$(git -C /tmp/sing-box-src log -1 --format=%cI)
          echo "Ядро: ветка $CORE_BRANCH, коммит $CORE_SHA, дата $CORE_DATE"

          REQUIRED_GO=$(grep -m1 '^go ' /tmp/sing-box-src/go.mod | awk '{print $2}')
          if [ -z "$REQUIRED_GO" ]; then
            REQUIRED_GO="1.24.0"
          fi
          echo "Требуемая версия Go: $REQUIRED_GO"

          echo "CORE_BRANCH=$CORE_BRANCH" >> $GITHUB_ENV
          echo "CORE_SHA=$CORE_SHA" >> $GITHUB_ENV
          echo "CORE_DATE=$CORE_DATE" >> $GITHUB_ENV
          echo "REQUIRED_GO=$REQUIRED_GO" >> $GITHUB_ENV

      - name: Build libbox.aar from source (official build_libbox script)
        run: |
          set -e
          echo "Устанавливаю Go $REQUIRED_GO..."
          curl -sSL "https://go.dev/dl/go${REQUIRED_GO}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
          sudo tar -C /usr/local -xzf /tmp/go.tar.gz
          export PATH=/usr/local/go/bin:$PATH:$(go env GOPATH)/bin
          export GOTOOLCHAIN=local
          go version

          echo "Ставлю gomobile/gobind v0.1.12..."
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          gomobile init

          cd /tmp/sing-box-src
          echo "Собираю через официальный скрипт cmd/internal/build_libbox (как это делает сам автор)..."
          go run ./cmd/internal/build_libbox -target android

          AAR_PATH=$(find /tmp/sing-box-src -maxdepth 1 -name "libbox.aar")
          if [ -z "$AAR_PATH" ]; then
            echo "❌ build_libbox не создал libbox.aar в ожидаемом месте"
            find /tmp/sing-box-src -maxdepth 1 -type f
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp "$AAR_PATH" "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          echo "✅ Собрано и скопировано libbox.aar (ветка $CORE_BRANCH, коммит $CORE_SHA)"

      - name: Print embedded core version from libbox.aar (ground truth)
        run: |
          mkdir -p /tmp/aar_inspect
          unzip -o app/libs/libbox.aar -d /tmp/aar_inspect > /dev/null
          SO_FILE=$(find /tmp/aar_inspect -name "libbox.so" -path "*arm64-v8a*" | head -n1)
          if [ -z "$SO_FILE" ]; then
            echo "⚠️ Не удалось найти libbox.so внутри aar для проверки"
          else
            echo "Версия/строки внутри $SO_FILE:"
            strings "$SO_FILE" | grep -E "^v?[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$" | sort -u | head -20
          fi
          echo "(Для сравнения: ядро собрано с ветки $CORE_BRANCH, коммит $CORE_SHA, дата $CORE_DATE)"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Auto-find newest commit that actually compiles
        if: ${{ github.event.inputs.app_ref == '' }}
        run: |
          MAX_ATTEMPTS=15
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            CURRENT=$(git rev-parse HEAD)
            echo "Попытка $((ATTEMPT+1))/$MAX_ATTEMPTS: пробую скомпилировать коммит $CURRENT"
            if ./gradlew :app:compileOtherDebugKotlin --no-daemon; then
              echo "✅ Коммит $CURRENT компилируется, используем его"
              break
            fi
            echo "❌ Коммит $CURRENT не компилируется, откатываюсь на предыдущий"
            git reset --hard HEAD~1
            ATTEMPT=$((ATTEMPT+1))
          done
          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "❌ За $MAX_ATTEMPTS попыток не нашли компилируемый коммит"
            exit 1
          fi
          if ! grep -q "handleShortcut" app/src/main/java/io/nekohasekai/sfa/compose/MainActivity.kt 2>/dev/null; then
            echo "❌ Откатились дальше, чем наш коммит с правками — handleShortcut больше не найден"
            exit 1
          fi

      - name: Build APK
        run: ./gradlew assembleOtherDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-debug
          path: app/build/outputs/apk/**/*.apk
